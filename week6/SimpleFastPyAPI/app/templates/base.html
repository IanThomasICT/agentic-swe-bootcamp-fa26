<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} &middot; SimpleFastPyAPI</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin/">SimpleFastPyAPI <span>Admin</span></a>
    <div class="topbar-actions">
      {% block topbar_actions %}{% endblock %}
    </div>
  </header>

  <main class="wrap">
    {% if message %}
    <p class="flash flash-ok">{{ message }}</p>
    {% endif %}
    {% if error %}
    <p class="flash flash-error">{{ error }}</p>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
